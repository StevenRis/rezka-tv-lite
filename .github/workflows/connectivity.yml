name: Rezka connectivity check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connectivity.yml'
      - 'scripts/catalog_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare public catalog metadata snapshot
        run: python3 scripts/catalog_probe.py
