name: Rezka connectivity check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connectivity.yml'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public homepage without cookies or authentication
        shell: python
        run: |
          import gzip
          import zlib
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          request = urllib.request.Request(
              "https://rezka.ag/",
              headers={
                  "User-Agent": "RezkaTVLite/0.1 compatibility-check",
                  "Origin": "https://stevenris.github.io",
              },
          )
          try:
              response = urllib.request.urlopen(request, timeout=20)
          except urllib.error.HTTPError as error:
              response = error
          except (urllib.error.URLError, TimeoutError) as error:
              print(json.dumps({"reachable": False, "error": str(error)}, ensure_ascii=False))
              raise SystemExit(0)

          with response:
              body = response.read(262144)
              encoding = response.headers.get("Content-Encoding", "").lower()
              if encoding == "gzip":
                  body = gzip.decompress(body)
              elif encoding == "deflate":
                  body = zlib.decompress(body)
              html = body.decode("utf-8", errors="replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", html, re.I | re.S)
              address = urllib.parse.urlsplit(response.geturl())
              result = {
                  "status": response.status,
                  "final_origin": address.scheme + "://" + address.netloc,
                  "bytes_read_up_to_256KiB": len(body),
                  "title": re.sub(r"\\s+", " ", title.group(1))[:180] if title else None,
                  "content_encoding": encoding,
                  "html_start": html[:350],
                  "first_card_html": html[max(0, html.find('class="b-content__inline_item"')-5):max(0, html.find('class="b-content__inline_item"')-5)+2400],
                  "content_type": response.headers.get("Content-Type"),
                  "access_control_allow_origin": response.headers.get("Access-Control-Allow-Origin"),
                  "x_frame_options": response.headers.get("X-Frame-Options"),
                  "inline_item_markers": html.count("b-content__inline_item"),
                  "availability_placeholder": "Site Unavailable" in html,
                  "possible_security_challenge": bool(re.search(
                      r"Just a moment|Verify you are human|Checking your browser", html, re.I
                  )),
              }
              print(json.dumps(result, ensure_ascii=False, indent=2))
